# slf4j-simple configuration.
#
# Silent by default: the WebSocket transport pulls slf4j-api (via Ktor) and we
# provide slf4j-simple as the binding so slf4j initializes cleanly, but we keep
# it off so the console stays quiet. To inspect Ktor/WebSocket activity, set
# defaultLogLevel (or the io.ktor logger below) to debug or info.
org.slf4j.simpleLogger.defaultLogLevel=off
# Per-package override example (uncomment to enable Ktor logs only):
# org.slf4j.simpleLogger.log.io.ktor=info
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=false
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.logFile=System.err
